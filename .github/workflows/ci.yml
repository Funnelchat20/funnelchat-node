name: CI

# Every pull request and every push to main. publish.yml also runs it, before publishing a tag.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check, test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The development tools (vitest 4 on vite 8, eslint 9) need Node 20.19 or later; Node 18 is
        # checked with the built package, in the job below.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run generate:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  runtime-floor:
    name: Built package on Node 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # The SDK runs on Node 18 or later (`engines`): the built package, ESM and CJS, runs there
      # with a fake fetch.
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: node scripts/smoke.mjs
