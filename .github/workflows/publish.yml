name: Publish to npm

# Publishes through npm Trusted Publishing (OIDC): no npm token is stored in this repo.
# A manual run (workflow_dispatch) publishes nothing; it only checks that the OIDC exchange with npm works.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The SDK runs on Node 18 or later, but prepublishOnly runs vitest 4 and eslint 9, which need Node 20 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      # Trusted Publishing needs npm 11.5.1 or later; npm 12 asks for Node versions the runners do not guarantee yet.
      - run: npm install -g npm@^11.5.1

      - name: Check the OIDC exchange with npm
        if: github.event_name == 'workflow_dispatch'
        run: |
          name="$(node -p "require('./package.json').name")"
          response="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org")"
          id_token="$(jq -r '.value // empty' <<< "$response")"
          unset response
          if [ -z "$id_token" ]; then
            echo "::error::Could not get a GitHub OIDC token"
            exit 1
          fi
          echo "::add-mask::$id_token"
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $id_token" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${name//\//%2f}")"
          unset id_token
          if [ "${status:0:1}" != "2" ]; then
            echo "::error::Trusted publishing failed for $name: HTTP $status"
            exit 1
          fi
          echo "Trusted publishing OK for $name"

      - name: Check that the tag matches the package version
        if: github.event_name != 'workflow_dispatch'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version (expected v$version)"
            exit 1
          fi

      - name: Check whether this version is already on npm
        id: published
        if: github.event_name != 'workflow_dispatch'
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "::notice::$name@$version is already on npm; nothing to publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
        if: github.event_name != 'workflow_dispatch' && steps.published.outputs.exists != 'true'

      # prepublishOnly runs generate:check, typecheck, lint, test and build before publishing.
      - run: npm publish --provenance --access public
        if: github.event_name != 'workflow_dispatch' && steps.published.outputs.exists != 'true'
